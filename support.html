<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support queue | AI Pharma Developments</title>
  <meta name="description" content="Dry-run support intake for AI Pharma Developments. No charges.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/favicon.svg">
</head>
<body>
  <header class="site-header"><a class="logo" href="index.html">AI Pharma Developments</a></header>
  <main class="wrap">
    <h1>Support queue</h1>
    <p>This form stores a local preview only. It does not create a Stripe charge, invoice, or customer. Agent submissions still require confirm=true on the worker.</p>
    <form id="support-form">
      <label>Name <input name="name" required maxlength="120"></label>
      <label>Email <input name="email" type="email" required maxlength="200"></label>
      <label>Topic
        <select name="topic">
          <option value="consult">Consult</option>
          <option value="retainer">Retainer preview</option>
          <option value="billing">Billing status</option>
          <option value="automation">Automation</option>
        </select>
      </label>
      <label>Need <textarea name="need" required maxlength="2000"></textarea></label>
      <button type="submit">Queue preview</button>
    </form>
    <pre id="support-out" aria-live="polite"></pre>
  </main>
  <script>
    document.getElementById('support-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const rec = { id: 'sup_local_' + Date.now().toString(36), status: 'queued_local', charged: false, ...data };
      const key = 'apd_support_queue';
      const prev = JSON.parse(localStorage.getItem(key) || '[]');
      prev.push(rec);
      localStorage.setItem(key, JSON.stringify(prev.slice(-20)));
      document.getElementById('support-out').textContent = JSON.stringify(rec, null, 2);
      e.target.reset();
    });
  </script>
</body>
</html>
