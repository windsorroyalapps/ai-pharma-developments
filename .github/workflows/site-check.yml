name: site-check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: node --check js/site.js js/stripe-checkout.js js/google-pay.js js/catalog.js js/careflow-demo.js cloud/worker/index.js cloud/worker/fulfillment.js tools/dry-run-check.js
      - name: Payment dry-run contract
        run: node tools/dry-run-check.js
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Site structure, links and canonical contact address
        run: |
          python tools/check-site.py
          python tools/set-contact-email.py --check
