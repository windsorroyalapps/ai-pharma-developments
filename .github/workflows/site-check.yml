name: site-check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: node --check js/site.js js/stripe-checkout.js js/google-pay.js js/catalog.js js/orders.js cloud/worker/index.js cloud/worker/fulfillment.js cloud/worker/ledger.js cloud/worker/dry-run-server.js tools/dry-run-check.js tools/stripe-test-readiness.js tools/ledger-summary.js
      - name: Payment dry-run contract
        run: node tools/dry-run-check.js
      - name: Stripe test-mode readiness
        run: node tools/stripe-test-readiness.js
      - name: Keyless worker session
        run: node -e "const http=require('http'); const {server}=require('./cloud/worker/dry-run-server'); const s=server.listen(0,async()=>{ const port=s.address().port; const refused=await fetch('http://127.0.0.1:'+port+'/agent-order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({confirm:false,amount_cents:10000})}); if(refused.status!==403) process.exit(2); const ok=await fetch('http://127.0.0.1:'+port+'/agent-order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({confirm:true,amount_cents:10000})}); const body=await ok.json(); if(!body.dry_run||body.charged!==false) process.exit(3); s.close(); });"
