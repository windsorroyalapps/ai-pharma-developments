name: site-check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: node --check js/site.js js/stripe-checkout.js js/pay-ledger.js js/checkout-gate.js js/intake.js js/google-pay.js js/catalog.js js/orders.js js/credit-notes.js cloud/worker/index.js cloud/worker/fulfillment.js cloud/worker/ledger.js cloud/worker/dry-run-server.js cloud/worker/credit-note.js cloud/automation/process-queue.js tools/dry-run-check.js tools/checkout-gate-check.js tools/invoice-preview.js tools/credit-note-preview.js tools/adjustment-queue.js tools/stripe-test-readiness.js tools/ledger-summary.js tools/consult-intake-check.js
      - name: Checkout confirm gate
        run: node tools/checkout-gate-check.js
      - name: Payment dry-run contract
        run: node tools/dry-run-check.js
      - name: Stripe test-mode readiness
        run: node tools/stripe-test-readiness.js
      - name: Consult intake agent gate
        run: node tools/consult-intake-check.js | grep -q '"charged": false'
      - name: Queue and invoice agent gate
        run: |
          set +e
          node tools/invoice-preview.js consult-30 --agent
          code=$?
          set -e
          test "$code" -eq 2
          node tools/invoice-preview.js consult-30 --agent --confirm | grep -q '"charged": false'
          set +e
          node tools/credit-note-preview.js consult-30 --agent
          cn=$?
          set -e
          test "$cn" -eq 2
          node tools/credit-note-preview.js consult-30 --cents 5000 --agent --confirm | grep -q '"refunded": false'
          APD_LEDGER_DIR="$RUNNER_TEMP/apd-ledger" node cloud/automation/process-queue.js cloud/automation/sample-queue.json | grep -q '"charged": 0'
          node tools/adjustment-queue.js cloud/automation/sample-adjustments.json | grep -q '"charged": 0'
          node tools/adjustment-queue.js cloud/automation/sample-adjustments.json | grep -q 'agent adjustments require confirm=true'
      - name: Keyless worker session
        run: node -e "const http=require('http'); const {server}=require('./cloud/worker/dry-run-server'); const s=server.listen(0,async()=>{ const port=s.address().port; const refused=await fetch('http://127.0.0.1:'+port+'/agent-order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({confirm:false,amount_cents:10000})}); if(refused.status!==403) process.exit(2); const ok=await fetch('http://127.0.0.1:'+port+'/agent-order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({confirm:true,amount_cents:10000})}); const body=await ok.json(); if(!body.dry_run||body.charged!==false) process.exit(3); const cn=await fetch('http://127.0.0.1:'+port+'/credit-note',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:'agent',confirm:false,sku:'consult-30',amount_cents:5000})}); if(cn.status!==403) process.exit(4); const cnOk=await fetch('http://127.0.0.1:'+port+'/credit-note',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:'agent',confirm:true,sku:'consult-30',amount_cents:5000,reason:'overlap'})}); const note=await cnOk.json(); if(note.refunded!==false||note.stripe_refund!==false) process.exit(5); s.close(); });"
